name: smartdeal

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/smartdeal
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: http://localhost:3000
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
  GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite}
  SERPAPI_KEY: ${SERPAPI_KEY:-}
  AMAZON_ACCESS_KEY: ${AMAZON_ACCESS_KEY:-}
  AMAZON_SECRET_KEY: ${AMAZON_SECRET_KEY:-}
  AMAZON_PARTNER_TAG: ${AMAZON_PARTNER_TAG:-}
  FLIPKART_AFFILIATE_ID: ${FLIPKART_AFFILIATE_ID:-}
  FLIPKART_AFFILIATE_TOKEN: ${FLIPKART_AFFILIATE_TOKEN:-}
  ENABLE_SCRAPERS: ${ENABLE_SCRAPERS:-false}
  DEMO_CATALOG: ${DEMO_CATALOG:-auto}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartdeal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdeal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: ["api"]
    environment:
      <<: *backend-env
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    command: ["worker"]
    environment: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  celery-beat:
    build: ./backend
    command: ["beat"]
    environment: *backend-env
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
